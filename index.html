                    <article id="sidang resmi pertama" class="card">
                        <h2> Sidang Resmi Pertama BPUPK dan Panitia Sembilan</h2>
                        <img src="asset/sidang pertama.jpg" alt="Sidang Resmi Pertama BPUPK dan Panitia Sembilan" class="featured-image" />
                        <p>
                            Pada tahun 1942, Kekaisaran Jepang menduduki Hindia Belanda. Semenjak awal pendudukan, pemerintahan militer Jepang 
                            sudah bekerja sama dengan para pemimpin kelompok kebangsaan dengan maksud untuk memenuhi keperluan perang dan 
                            pendudukan.Agar kerja sama dengan kelompok kebangsaan di Jawa dapat dimaksimalkan, Jepang membentuk 
                            organisasi Jawa Hokokai pada awal Januari 1944,dan organisasi ini merupakan pengganti Pusat Tenaga 
                            Rakyat yang telah dibubarkan.Ketika Jepang mulai mengalami kekalahan dalam Perang Pasifik, Perdana Menteri 
                            Jepang Kuniaki Koiso berjanji akan memberikan kemerdekaan kepada seluruh bangsa Indonesia pada suatu hari.
                        </p>
                        <p>
                            Pada 1 Maret 1945, Angkatan Darat ke-16, korps militer Jepang yang melaksanakan pemerintahan atas wilayah Jawa, 
                            membentuk Badan Penyelidikan Usaha-Usaha Persiapan Kemerdekaan (BPUPK, bahasa Jepang: Dokuritsu Junbi Chōsa-kai).
                            Badan ini bertugas menetapkan dasar negara Indonesia dan merumuskan undang-undang dasarnya.BPUPK terdiri dari 62 
                            anggota, dengan 47 dari antaranya berasal dari golongan kebangsaan dan 15 dari golongan Islam.Wakil-wakil kelompok 
                            Islam meyakini bahwa undang-undang dasar Indonesia sepatutnya dilandaskan pada syariat.BPUPK menggelar sidang 
                            resmi pertamanya di Jakarta dari tanggal 29 Mei hingga 1 Juni 1945.Dalam sidang ini, Soekarno menyampaikan 
                            pidatonya yang terkenal, "Lahirnya Pancasila", pada tanggal 1 Juni 1945. Pidato ini menjadikan Pancasila sebagai 
                            dasar negara Indonesia,dengan "ketuhanan" sebagai sila kelimanya.Terkait sila ini, Soekarno menjelaskan:
                        </p>
                        <p>
                            Prinsip yang kelima hendaknya: Menyusun Indonesia Merdeka dengan bertakwa kepada Tuhan yang Maha Esa. Prinsip Ketuhanan! 
                            Bukan saja bangsa Indonesia bertuhan, tetapi masing-masing orang Indonesia hendaknya bertuhan Tuhannya sendiri. Yang Kristen 
                            menyembah Tuhan menurut petunjuk Isa al Masih, yang Islam bertuhan menurut petunjuk Nabi Muhammad s.a.w., orang Buddha 
                            menjalankan ibadatnya menurut kitab-kitab yang ada padanya. Tetapi marilah kita semuanya ber-Tuhan. Hendaknya negara 
                            Indonesia ialah negara yang tiap-tiap orangnya dapat menyembah Tuhannya dengan cara yang leluasa.
                        </p>
                        <p> 
                            Sebelum memasuki masa reses, BPUPK membentuk sebuah Panitia Kecil yang terdiri dari delapan anggota dengan Soekarno sebagai 
                            ketuanya. Panitia ini bertugas mengumpulkan usulan-usulan dari anggota-anggota BPUPK lainnya untuk dibahas kelak.Untuk 
                            mengurangi ketegangan antara kelompok kebangsaan dengan Islam, Soekarno membentuk Panitia Sembilan pada tanggal 18 Juni 1945. 
                            Panitia yang diketuai oleh Soekarno ini bertugas merumuskan mukadimah undang-undang dasar Indonesia yang dapat diterima oleh 
                            kedua belah pihak.Sesuai namanya, panitia ini terdiri sembilan anggota, dengan empat anggota berasal dari kelompok Islam 
                            dan lima dari kelompok kebangsaan.
                
                        </p>
                        
                        <p> Pada tanggal 22 Juni 1945, Panitia Sembilan merumuskan naskah usulan Mukadimah Undang-Undang Dasar Indonesia, 
                            yang kemudian diberi julukan "Piagam Jakarta" oleh Mohammad Yamin.
                        </p>


                    </article>
                    <article id="naskah piagam jakarta" class="card">
                        <h2>Naskah Piagam Jakarta</h2>

                        
                        <h4>Ejaan Van Ophuijsen</h4>
                        <p>
                            Bahwa sesoenggoehnja kemerdekaan itoe jalah hak segala bangsa, dan oleh sebab <br>
                            itoe maka pendjadjahan diatas doenia haroes dihapoeskan, 
                            karena tidak sesoeai dengan peri-kemanoesiaan dan peri-keadilan.
                        </p>
                        <p>
                            Dan perdjoeangan pergerakan kemerdekaan Indonesia telah sampailah kepada saat 
                            jang berbahagia dengan selamat-sentaoesa mengantarkan rakjat Indonesia kedepan 
                            pintoe gerbang Negara Indonesia jang merdeka, bersatoe, berdaoelat, adil dan makmoer.
                        </p>
                        <p>
                            Atas berkat Rahmat Allah Jang Maha Koeasa, dan dengan didorongkan oleh keinginan luhur, 
                            soepaja berkehidupan kebangsaan jang bebas, maka rakjat Indonesia dengan ini menjatakan kemerdekaanja.
                        </p>
                         <p>
                            Atas berkat Rahmat Allah Jang Maha Koeasa, dan dengan didorongkan oleh keinginan luhur, soepaja 
                            berkehidupan kebangsaan jang bebas, maka rakjat Indonesia dengan ini menjatakan kemerdekaanja.

                         </p> 
                         <p>
                            Kemoedian dari pada itu untuk membentoek soeatu Pemerintah Negara Indonesia jang melindungi 
                            segenap bangsa Indonesia dan seloeroeh toempah-dara Indonesia, dan oentoek memadjoekan 
                            kesedjahteraan oemoem, mentjerdaskan kehidoepan bangsa, dan ikoet melaksanakan ketertiban 
                            doenia jang berdasarkan kemerdekaan, perdamaian abadi dan keadilan sosial, maka 
                            disoesoenlah kemerdekaan kebangsaan Indonesia itoe dalam soeatu hoekoem dasar Negara 
                            Indonesia jang terbentuk dalam soeatu soesoenan negara Republik Indonesia, jang 
                            berkedaoelatan rakjat, dengan berdasar kepada: ketoehanan, dengan kewadjiban mendjalankan 
                            sjari'at Islam bagi pemeloek-pemeloeknja, menoeroet dasar kemanoesiaan jang adil dan beradab, 
                            persatoean Indonesia, dan kerakjatan jang dipimpin oleh hikmat kebidjaksanaan dalam 
                            permoesjawaratan/perwakilan serta dengan mewoedjoedkan soeatu keadilan sosial bagi seloeroeh rakjat Indonesia.
                         </p>  

                         <h4>Ejaan yang Disempurnakan</h4>
                         <p>
                            Bahwa sesungguhnya kemerdekaan itu ialah hak segala bangsa, dan oleh sebab itu maka penjajahan di atas dunia harus dihapuskan, 
                            karena tidak sesuai dengan perikemanusiaan dan perikeadilan.
                         </p>
                         <p>
                            Dan perjuangan pergerakan kemerdekaan Indonesia telah sampailah kepada saat yang berbahagia dengan selamat sentosa mengantarkan 
                            rakyat Indonesia ke depan pintu gerbang negara Indonesia yang merdeka, bersatu, berdaulat, adil, dan makmur.
                         </p>
                         <p>
                            Atas berkat Rahmat Allah yang Maha Kuasa, dan dengan didorongkan oleh keinginan luhur, supaya berkehidupan kebangsaan yang bebas, 
                            maka rakyat Indonesia menyatakan dengan ini kemerdekaannya.
                         </p>
                         <p>
                            Kemudian dari pada itu untuk membentuk suatu Pemerintah Negara Indonesia Merdeka yang melindungi segenap bangsa Indonesia dan 
                            seluruh tumpah darah Indonesia, dan untuk memajukan kesejahteraan umum, mencerdaskan kehidupan bangsa, dan ikut melaksanakan 
                            ketertiban dunia yang berdasarkan kemerdekaan, perdamaian abadi, dan keadilan sosial, maka disusunlah kemerdekaan kebangsaan 
                            Indonesia itu dalam suatu Hukum Dasar Negara Indonesia, yang terbentuk dalam suatu susunan Negara Republik Indonesia, yang 
                            berkedaulatan rakyat, dengan berdasar kepada: ketuhanan, dengan kewajiban menjalankan syari’at Islam bagi pemeluk-pemeluknya, 
                            menurut dasar kemanusiaan yang adil dan beradab, persatuan Indonesia, dan kerakyatan yang dipimpin oleh hikmat kebijaksanaan 
                            dalam permusyawaratan perwakilan, serta dengan mewujudkan suatu keadilan sosial bagi seluruh rakyat Indonesia.
                         </p>
                         <p>Naskah ini bertanggal 22 Juni 2605 dalam kalender Jepang (22 Juni 1945 dalam kalender Gregorius) dan ditandatangani oleh 
                            anggota-anggota Panitia Sembilan

                         </p>

                    </article>
                    <article id="piagam jakarta sebagai kompromi" class="card">
                        <h2>Piagam Jakarta sebagai Kompromi</h2>
                        <p>
                            Di paragraf keempat dan terakhir Piagam Jakarta, terkandung lima butir sila yang kini dianggap sebagai bagian dari Pancasila:
                        </p>
                        <p>
                            1. Ketuhanan, dengan kewajiban menjalankan syariat Islam bagi pemeluk-pemeluknya<br>
                            2. Kemanusiaan yang adil dan beradab<br>
                            3. Persatuan Indonesia<br>
                            4. Kerakyatan yang dipimpin oleh hikmat, kebijaksanaan dalam permusyawaratan/perwakilan<br>
                            5. Keadilan sosial bagi seluruh rakyat Indonesia<br>
                        </p>
                        <p>
                            Dalam Piagam Jakarta, asas "ketuhanan" dijadikan sila pertama, sementara dalam rumusan Pancasila yang dikemukakan 
                            oleh Soekarno dalam pidatonya pada 1 Juni 1945, "ketuhanan" merupakan sila kelima. Perbedaan terbesar antara 
                            Piagam Jakarta dengan rumusan Pancasila Soekarno adalah keberadaan frasa "dengan kewajiban menjalankan syariat Islam 
                            bagi pemeluk-pemeluknya". Frasa yang dikenal dengan sebutan "tujuh kata" ini mengakui syariat untuk Muslim. Anggota 
                            Panitia Sembilan Abdoel Kahar Moezakir kelak mengklaim dalam sebuah wawancara pada Desember 1957 bahwa anggota lain 
                            yang beragama Kristen, Alexander Andries Maramis, setuju "200%" dengan rumusan ini.Rumusan tujuh kata sendiri 
                            dianggap rancu dan tidak diketahui apakah rumusan tersebut membebankan kewajiban menjalankan syariat Islam kepada 
                            perseorangan atau pemerintah. Walaupun begitu, Piagam Jakarta merupakan hasil kompromi dan sila pertamanya dapat 
                            ditafsirkan berbeda sesuai dengan kepentingan kelompok Islam ataupun kebangsaan.
                        </p>
                    </article>
                    <article id="sidang resmi kedua" class="card">
                        <h2> Sidang Resmi kedua BPUPK</h2>
                        <img src="asset/sidang kedua.jpg" alt="Sidang Resmi kedua BPUPK" class="featured-image">
                        <p>
                            Sesuai dengan saran dari Panitia Sembilan, BPUPK menggelar sidang resmi keduanya dari 10 hingga 17 Juli 1945 di bawah kepemimpinan 
                            Soekarno. Tujuannya adalah untuk membahas permasalahan terkait undang-undang dasar, termasuk rancangan mukadimah yang terkandung 
                            dalam Piagam Jakarta.Pada hari pertama, Soekarno melaporkan hal-hal yang telah dicapai selama pembahasan pada masa reses, 
                            termasuk Piagam Jakarta. Ia juga mengabarkan bahwa Panitia Kecil telah menerima Piagam Jakarta secara bulat. Menurut Soekarno, 
                            piagam ini mengandung "segenap pokok-pokok pikiran yang mengisi dada sebagian besar daripada anggota-anggota Dokuritu Zyunbi 
                            Tyoosakai (BPUPK)".
                        </p>
                        <p>
                            Pada hari kedua sidang (tanggal 11 Juli), tiga anggota BPUPK menyampaikan penolakan mereka terhadap tujuh kata dalam Piagam Jakarta. 
                            Salah satunya adalah Johannes Latuharhary, seorang anggota beragama Protestan yang berasal dari Pulau Ambon. Ia merasa bahwa tujuh 
                            kata dalam Piagam Jakarta akan menimbulkan dampak yang "besar sekali" terhadap agama lain. Ia juga mengungkapkan kekhawatirannya 
                            bahwa tujuh kata tersebut akan memaksa etnis Minangkabau meninggalkan adat istiadat mereka dan juga berdampak terhadap hak tanah 
                            yang berlandaskan pada hukum adat di Maluku. Dua anggota lain yang tidak setuju dengan tujuh kata adalah Wongsonegoro dan Hoesein 
                            Djajadiningrat. Menurut Djajadiningrat, tujuh kata dapat menimbulkan fanatisme karena seolah memaksakan umat Islam untuk menjalankan 
                            hukum syariat. Salah satu anggota Panitia Sembilan, Wahid Hasjim, menampik kemungkinan terjadinya pemaksaan karena adanya dasar 
                            permusyawaratan. Ia juga berkomentar bahwa meskipun ada anggota yang menganggap tujuh kata itu "tajam", ada pula yang menganggapnya 
                            "kurang tajam".
                        </p>
                        <p>
                            Dua hari sesudahnya, pada 13 Juli, Hasjim menggagas perubahan Pasal 4 Rancangan Undang-Undang Dasar agar Presiden Indonesia harus 
                            beragama Islam. Ia juga mengusulkan agar Pasal 29 Rancangan Undang-Undang Dasar (yang berkaitan dengan agama) diamendemen untuk 
                            menjadikan Islam sebagai agama negara ditambah dengan klausul yang menjamin kebebasan beragama untuk kaum non-Muslim. Menurutnya,
                            hal ini diperlukan karena hanya agama yang dapat membenarkan penggunaan kekuatan untuk mengambil nyawa dalam konteks pertahanan 
                            nasional.Anggota BPUPK lainnya, Otto Iskandardinata, menentang usulan agar Presiden Indonesia harus Muslim, dan mengusulkan agar 
                            tujuh kata di Piagam Jakarta diulang dalam Pasal 29 Rancangan Undang-Undang Dasar
                        </p>
                        <P>
                            Piagam Jakarta kembali dibahas dalam rapat yang digelar pada 14 Juli, salah satunya karena terdapat rencana untuk menggunakan isi 
                            dari piagam tersebut dalam deklarasi kemerdekaan Indonesia.Dalam rapat ini, Ketua Umum Muhammadiyah Ki Bagoes Hadikoesoemo 
                            mengusulkan agar frasa "bagi pemeluk-pemeluknya" dihapus. Soekarno menolak usulan tersebut dengan argumen bahwa tujuh kata 
                            merupakan hasil kompromi: 
                        </P>
                        <P>
                            Jadi panitia memegang teguh akan kompromis yang dinamakan oleh anggota yang terhormat Muh. Yamin "Jakarta Charter", yang disertai dengan 
                            perkataan tuan anggota yang terhormat Soekiman, "Gentlemen Agreement", supaya ini dipegang teguh diantara pihak Islam dan Kebangsaan.

                        </P>
                        <p>
                            Hadikoesoemo juga berpandangan bahwa umat Islam akan merasa dihina jika ada aturan yang berbeda untuk Muslim dan non-Muslim. 
                            Soekarno menjawab bahwa jika frasa tersebut dihapus, akan muncul tafsir bahwa kaum non-Muslim juga wajib menjalankan syariat 
                            Islam. Hadikoesoemo menampik kekhawatiran Soekarno karena menurutnya "Pemerintah tidak boleh memeriksa agama".Pada akhirnya, 
                            Hadikoesoemo berhasil diyakinkan oleh anggota lain dari golongan Islam, Abikusno Tjokrosujoso, bahwa tujuh kata sebaiknya 
                            dibiarkan seperti itu demi persatuan dan perdamaian.
                        </p>
                        <p>
                            Pada sore hari tanggal 15 Juli, Hadikoesoemo kembali mengajukan usulannya. Karena merasa kekhawatirannya tidak dijawab dengan 
                            memuaskan, ia menyatakan penolakannya terhadap kompromi dalam Piagam Jakarta.Kemudian, pada tanggal 16 Juli, Soekarno membuka 
                            rapat dengan permohonan kepada kelompok kebangsaan untuk mau berkorban dengan memasukkan tujuh kata Piagam Jakarta ke dalam 
                            batang tubuh undang-undang dasar dan juga dengan menambahkan klausul bahwa Presiden Republik Indonesia harus Muslim.
                            Kelompok kebangsaan memenuhi permohonan ini, sehingga BPUPK menyetujui sebuah rancangan undang-undang dasar yang 
                            mengandung tujuh kata di Mukadimah dan Pasal 29, serta sebuah klausul yang menyatakan bahwa Presiden Indonesia harus 
                            beragama Islam
                        </p> 

                    </article>
                    <article id="penghapusan tujuh kata" class="card">
                        <h2>Penghapusan tujuh kata</h2>
                        <img src="asset/proklamasi kemerdekaan.png" alt="Penghapusan tujuh kata " class="proklamasi">   
                        <p>
                            Pada tanggal 7 Agustus 1945, pemerintah Jepang mengumumkan pembentukan Panitia Persiapan Kemerdekaan Indonesia 
                            (PPKI). Kemudian, pada 12 Agustus, Soekarno diangkat sebagai ketuanya oleh Panglima Kelompok Ekspedisi Selatan 
                            Marsekal Medan Hisaichi Terauchi. Hanya empat dari sembilan penandatangan Piagam Jakarta yang menjadi anggota 
                            PPKI, yaitu Soekarno, aMohammad Hatta, Achmad Soebardjo, dan Wahid Hasjim. Pada mulanya anggota PPKI akan 
                            berkumpul pada 19 Agustus untuk memfinalisasi undang-undang dasar Indonesia.Namun, pada 6 dan 9 Agustus 1945, 
                            kota Hiroshima dan Nagasaki dibom atom oleh Sekutu. Kemudian, pada 15 Agustus, Kaisar Hirohito mengumumkan bahwa 
                            Jepang telah menyerah tanpa syarat kepada Sekutu.
                        </p>
                        <p>
                            Soekarno dan Hatta menyatakan kemerdekaan Indonesia pada 17 Agustus. Kemudian, pada pagi hari tanggal 18 Agustus, PPKI berkumpul 
                            untuk mengesahkan undang-undang dasar Indonesia. Dalam pertemuan tersebut, Hatta mengusulkan agar tujuh kata di Mukadimah dan Pasal 
                            29 dihapus. Seperti yang kemudian dijelaskan Hatta dalam bukunya Sekitar Proklamasi 17 Agustus 1945, pada malam hari tanggal 17 
                            Agustus, seorang opsir kaigun (Angkatan Laut) Jepang mendatanginya dan menyampaikan kabar bahwa kelompok nasionalis beragama Kristen 
                            dari Indonesia Timur menolak tujuh kata karena dianggap diskriminatif terhadap penganut agama minoritas, dan mereka bahkan menyatakan 
                            lebih baik mendirikan negara sendiri di luar Republik Indonesia jika tujuh kata tersebut tidak dicabut
                        </p>
                        <p>
                            Hatta lalu menjabarkan usulan perubahannya: istilah "ketuhanan" akan diganti dengan "ketuhanan yang maha esa",sementara istilah "Mukadimah" 
                            yang berasal dari bahasa Arab diganti menjadi "Pembukaan". Ayat yang menyatakan bahwa Presiden Indonesia harus Muslim juga dihapus. 
                            Setelah usulan ini diterima, PPKI menyetujui Undang-Undang Dasar Republik Indonesia pada hari yang sama, dan tujuh kata pun secara 
                            resmi dihapus. Perwakilan Bali I Gusti Ketut Pudja juga mengusulkan agar "Allah" diganti dengan "Tuhan". Usulan tersebut diterima, 
                            tetapi saat konstitusi resmi dipublikasi, perubahan tersebut tak dilakukan.
                        </p>
                        <p>
                            Tidak diketahui secara pasti mengapa PPKI menyetujui usulan Hatta tanpa adanya perlawanan dari golongan Islam. Di satu sisi, 
                            komposisi anggota PPKI sangat berbeda dengan BPUPK: hanya 12% anggota PPKI yang berasal dari golongan Islam (sementara di BPUPK 
                            terdapat 24%). Dari sembilan penandatangan Piagam Jakarta, hanya tiga yang hadir dalam pertemuan tanggal 18 Agustus. Ketiga 
                            orang itu pun bukan berasal dari golongan Islam; Hasjim yang datang dari Surabaya baru tiba di Jakarta pada 19 Agustus. Di sisi lain, 
                            Indonesia pada masa itu tengah terancam oleh kedatangan pasukan Sekutu, sehingga yang menjadi prioritas adalah pertahanan nasional 
                            dan upaya untuk memperjuangkan aspirasi golongan Islam dapat ditunda hingga situasinya memungkinkan
                        </p>
                        <p>
                            Keputusan untuk menghapus tujuh kata mengecewakan golongan Islam.Hadikoesoemo mengungkapkan kemarahannya dalam pertemuan 
                            Majelis Tanwir Muhammadiyah di Yogyakarta beberapa hari setelah sidang PPKI selesai.Golongan Islam juga merasa semakin 
                            tidak puas setelah PPKI pada tanggal 19 Agustus menolak usulan untuk mendirikan Kementerian Agama.Walaupun begitu, seiring dengan 
                            kedatangan pasukan Sekutu, golongan Islam memutuskan untuk memprioritaskan persatuan nasional demi mempertahankan kemerdekaan 
                            Indonesia
                        </p>
